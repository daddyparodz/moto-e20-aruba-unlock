name: Verify replay package on self-hosted Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ubuntu:24.04
    timeout-minutes: 10
    steps:
      - name: Install Linux build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates build-essential file git libusb-1.0-0-dev pkg-config python3
      - uses: actions/checkout@v5
      - name: Build pinned native Linux transport
        run: ./scripts/build-linux-tools.sh
      - name: Rebuild exact unlock files
        run: python3 scripts/build-unlock-files.py
      - name: Verify release and native transport
        run: python3 scripts/verify-release.py --check-linux-tool build/linux-tools/spd_dump
